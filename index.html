<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Forge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a focused training log — quiet, precise, rewarding when you earn it.
IDEA: a gym's black rubber floor and a single red plate; everything else gets out of the way.
PICTURE: the level badge, progress rings and set rows are the picture.
COLOUR and TYPE: near-black ground, graphite panels, one red accent; Inter for text, Barlow Condensed for numbers.
LAYOUT: one phone column, bottom tab bar, a full-screen workout mode with a fixed finish bar.
*/
:root{--bg:#09090b;--s1:#121215;--s2:#1a1a1e;--s3:#24242a;--line:#25252b;--ink:#f4f4f5;--mut:#8d8d97;--dim:#55555e;--red:#ff2d3f;--red2:#d61f30;--rg:rgba(255,45,63,.15);--r:20px;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(100px + env(safe-area-inset-bottom))}
body.inwk #main{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
h1{font:700 32px/1.05 'Barlow Condensed',Inter,sans-serif;margin:2px 0 0}
.h2{font-weight:600;font-size:21px;line-height:1.15;letter-spacing:-.3px}
.h3{font-weight:600;font-size:15px}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}.red{color:var(--red)}.ink{color:var(--ink)}.c{text-align:center}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .acts{display:flex;gap:8px;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.mt{margin-top:16px}
.eyebrow{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}.eyebrow.red{color:var(--red)}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--ink);flex:none}
.ib svg{width:20px;height:20px}
.ib.sm{width:36px;height:36px;border-radius:11px;background:transparent;border-color:transparent;color:var(--mut)}.ib.sm svg{width:17px;height:17px}
.ib:disabled{opacity:.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--s2);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 24px -10px rgba(255,45,63,.7)}
.btn.red:active{background:var(--red2)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:#4a1a1f;color:var(--red)}
.btn.full{width:100%;margin-top:12px}.btn.lg{min-height:56px;font-size:16px;border-radius:16px}.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.link{display:block;margin:10px auto 0;color:var(--mut);font-size:14px;font-weight:500;padding:8px 10px}
.link.danger{color:var(--red)}.link.in{display:inline;margin:0;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--red);font-weight:600}.chip svg{width:14px;height:14px}
.chip.on{background:var(--rg);border-color:var(--red)}
.chip.install{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.chip:active,.btn:active,.hab:active{transform:scale(.97)}
input,select{width:100%;min-height:46px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--red)}
.lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:14px}.lbl input,.lbl select{margin-top:6px;color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* level */
.lvrow{display:flex;gap:16px;align-items:center}
.badge{width:68px;height:68px;border-radius:20px;background:radial-gradient(120% 120% at 30% 20%,#ff4b5a,#b0121f);display:grid;place-items:center;flex:none;box-shadow:0 10px 30px -12px rgba(255,45,63,.8),inset 0 1px 0 rgba(255,255,255,.25);line-height:1;align-content:center}
.badge .num{font-size:34px;color:#fff;text-align:center}.badge small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.75);text-align:center}
.lvinfo{flex:1}.rank{font-weight:600;font-size:17px}
.bar{height:8px;background:var(--s3);border-radius:99px;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red));border-radius:99px;transition:width .5s}
.streaks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stk{background:var(--s2);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px}
.stk svg{width:20px;height:20px;color:var(--dim);flex:none}.stk.on svg{color:var(--red)}
.stk b{font-size:24px;line-height:1;display:block}.stk small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
/* hero */
.hero .h2{font-size:26px;margin-bottom:2px}
.exl{list-style:none;padding:0;margin:12px 0 0}.exl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.exl li span:last-child{white-space:nowrap}
.hero.rest .h2{color:var(--mut)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.wd i{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.wd i svg{width:16px;height:16px}
.wd.plan i{border-color:var(--red);border-style:dashed}.wd.opt i{border-style:dashed;border-color:var(--dim)}
.wd.done i{background:var(--red);border-color:var(--red);color:#fff}
.wd.miss i{background:var(--s2);border-color:var(--s2)}.wd.miss i::after{content:'';width:10px;height:2px;border-radius:2px;background:var(--dim)}
.wd.now span{color:var(--ink);font-weight:700}
/* ring */
.ringw{position:relative;display:grid;place-items:center;flex:none}
.ring .rt{fill:none;stroke:var(--s3);stroke-width:8}.ring .rv{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.full .rv{filter:drop-shadow(0 0 6px rgba(255,45,63,.6))}
.rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rl b{font-size:24px}.rl small{font-size:11px;color:var(--mut);margin-top:2px}
.ringw.lg .rl b{font-size:54px}.ringw.lg .rl small{font-size:14px;margin-top:4px}
.ringw.lg .ring .rt,.ringw.lg .ring .rv{stroke-width:12}
.pmini{display:flex;gap:16px;align-items:center}.pm{flex:1}.pm .chips{margin-top:8px}.pm .chip{min-height:36px;padding:0 12px}
.pbig{text-align:center}.pbig .ringw{margin:6px auto 12px}
/* habits */
.hab{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 2px;border-top:1px solid var(--line);text-align:left}
.hl .hab:first-child{border-top:0}
.cb{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--dim);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.cb svg{width:16px;height:16px}
.hab.on .cb{background:var(--red);border-color:var(--red);color:#fff}
.hab span{flex:1;font-weight:500}.hab.on span{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--dim)}
.hab small{display:flex;align-items:center;gap:3px;color:var(--mut);font-weight:600}.hab small svg{width:14px;height:14px;color:var(--red)}
.addrow,.padd{display:flex;gap:8px;margin-top:12px}.addrow input{flex:1}
.padd #pl{flex:2}.padd #pg{flex:1;max-width:84px;text-align:center}
.hgrid{padding:10px 0;border-top:1px solid var(--line)}.hgrid:first-of-type{border-top:0}
.hn{display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:8px}.hn .acts{display:flex}
.dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:6px}
.dots i{aspect-ratio:1;border-radius:4px;background:var(--s3)}.dots i.on{background:var(--red)}.dots i.na{background:transparent;border:1px dashed var(--line)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.big{font-size:36px;line-height:1}.big small{font-size:18px;color:var(--mut)}
/* workout */
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}.wt{flex:1}
.pbar{height:4px;background:var(--s3);border-radius:9px;overflow:hidden;margin-bottom:14px}.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.exh{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.pbtag{font-size:12px;color:var(--red);white-space:nowrap;font-weight:600;background:var(--rg);border-radius:99px;padding:3px 9px;align-self:flex-start}
.shd,.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.shd{font-size:11px;color:var(--dim);padding-bottom:2px;text-align:center}
.set{padding:4px 0}
.set .sn{font-weight:600;color:var(--mut);text-align:center}
.set input{text-align:center;font-weight:600;min-height:48px;padding:0 6px}
.set input::placeholder{color:var(--dim);font-weight:500}
.tick{width:50px;height:48px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.tick svg{width:22px;height:22px}
.set.on .tick{background:var(--red);border-color:var(--red);color:#fff}
.set.on input{background:var(--rg);border-color:transparent}.set.on .sn{color:var(--red)}
.exf{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.exf .chip{min-height:34px;font-size:13px}.exf .chip:last-child{margin-left:auto;color:var(--mut)}
.finishbar{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%);z-index:5}
.finishbar .btn{max-width:528px;margin:0 auto;display:flex;width:100%}
#rest{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;z-index:6;display:flex;align-items:center;gap:6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#rest[hidden]{display:none}
#restb{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
#rest .lab{font-size:12px;color:var(--mut);margin-right:4px}
#restt{font-size:28px;flex:1}
#rest .chip{min-height:36px;padding:0 11px;font-size:13px}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(12,12,14,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs[hidden]{display:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;color:var(--dim);font-size:11px;font-weight:500}
#tabs svg{width:22px;height:22px}
#tabs button.on{color:var(--ink)}#tabs button.on svg{color:var(--red)}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#ov[hidden]{display:none}
#sheet{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
#sheet form input{margin-top:14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-top:10px;text-align:left}
.askm{font-size:16px;margin:4px 0 8px}
.xb{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.xb b{color:var(--red);white-space:nowrap}
.sumx{font-size:68px;color:var(--red);line-height:1;margin:12px 0 2px}
.lvbanner{background:var(--rg);border:1px solid var(--red);border-radius:14px;padding:12px;text-align:center;font-weight:600;margin-top:14px}
.lvup{text-align:center;padding:6px 0}
.burst{width:124px;height:124px;margin:10px auto 18px;border-radius:36px;display:grid;place-items:center;font:700 66px 'Barlow Condensed',sans-serif;color:#fff;background:radial-gradient(120% 120% at 30% 20%,#ff5563,#a50f1c);box-shadow:0 0 0 10px var(--rg),0 20px 60px -10px rgba(255,45,63,.9);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.t{background:var(--s3);border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;animation:tin .25s;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
.t.xp{background:var(--red);border-color:var(--red);color:#fff}
/* progress */
.heat{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3)}
.l1{background:#4a1820!important}.l2{background:#8a1c29!important}.l3{background:#c42232!important}.l4{background:var(--red)!important}.heat .fut{background:transparent}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--mut);margin-top:10px}.legend i{width:11px;height:11px;border-radius:3px;background:var(--s3)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}.tile b{font-size:36px;line-height:1;display:block}.tile span{font-size:12px;color:var(--mut)}
.xparts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px;font-size:11px;color:var(--mut)}.xparts b{display:block;font-size:20px;color:var(--ink)}
.ach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ac{background:var(--s2);border-radius:14px;padding:12px 6px;text-align:center;opacity:.42}
.ac i{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 6px;border-radius:12px;background:var(--s3);color:var(--dim)}.ac i svg{width:20px;height:20px}
.ac b{display:block;font-size:12.5px;line-height:1.2}.ac small{display:block;font-size:11px;color:var(--mut);line-height:1.25;margin-top:3px}.ac em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:4px;font-weight:600}
.ac.on{opacity:1}.ac.on i{background:var(--rg);color:var(--red)}.ac.on em{color:var(--red)}
.li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.li>span:first-child{flex:1}.li .num{font-size:19px;white-space:nowrap}
.lift{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.lift .row{justify-content:space-between}.lift .num{font-size:18px;white-space:nowrap}
.spark{width:100%;height:110px;display:block;margin-top:10px}
.sparkl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.b7{display:grid;grid-template-columns:36px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;margin-top:9px}
.b7 .tr{height:10px;background:var(--s3);border-radius:9px;overflow:hidden}.b7 .tr i{display:block;height:100%;background:var(--dim);border-radius:9px}.b7.hit .tr i{background:var(--red)}
.b7 span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sess{border-top:1px solid var(--line);padding:12px 0}
.sess>button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.sd{font-size:13px;color:var(--mut);margin-top:8px}.sd div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.sd div span:last-child{text-align:right}
.note{display:flex;gap:10px;align-items:flex-start;border-color:#3a1a1f;background:linear-gradient(135deg,rgba(255,45,63,.10),transparent 70%)}.note>div{flex:1}
.erow{padding:12px 0;border-top:1px solid var(--line)}.ers{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.ers label{font-size:11px;color:var(--mut);width:68px;flex:none}.ers label input{margin-top:4px;text-align:center;padding:0 4px}
.ers .sp{flex:1}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:6px}.seg button{min-height:38px;padding:0 20px;border-radius:9px;color:var(--mut);font-weight:600}.seg button.on{background:var(--red);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:12px}.chk input{width:18px;height:18px;min-height:0;accent-color:var(--red)}
.xpl{margin:8px 0 0;padding:0;list-style:none;font-size:14px}.xpl li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}.xpl b{color:var(--red);white-space:nowrap}
.empty{color:var(--mut);padding:6px 0;margin:0}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:370px){.streaks{gap:6px}.stk{padding:8px;gap:6px}.stk svg{display:none}.ach{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main id="main"></main>
<div id="rest" hidden><span class="lab">Rest</span><span id="restt" class="num">0:00</span><button class="chip" data-a="rest" data-v="-15">−15</button><button class="chip" data-a="rest" data-v="15">+15</button><button class="chip" data-a="restSkip">Skip</button><i id="restb"></i></div>
<nav id="tabs"></nav>
<div id="ov" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>
<script>
{
'use strict';
const KEY='forge.v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey();
const weekStart=k=>{const d=parseD(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function calc(){
 const st=S.settings,t=today();
 const pT=k=>(S.protein[k]||[]).reduce((a,b)=>a+(+b.g||0),0);
 const hit=k=>st.protein>0&&pT(k)>=st.protein;
 const activeH=k=>S.habits.filter(h=>h.created<=k&&(!h.archived||h.archived>k));
 const perfect=k=>{const hs=activeH(k);if(!hs.length)return false;const l=S.habitLog[k]||[];return hs.every(h=>l.includes(h.id))};
 let start=S.created;
 for(const k of[...Object.keys(S.protein),...Object.keys(S.habitLog),...S.sessions.map(s=>s.date)])if(k<start)start=k;
 let protXP=0,habXP=0,hitDays=0,maxProt=0,maxPerf=0,rp=0,rh=0;
 for(let k=start;k<=t;k=addDays(k,1)){
  const h=hit(k),p=perfect(k);
  if(h){protXP+=30;hitDays++}
  habXP+=(S.habitLog[k]||[]).length*10;if(p)habXP+=20;
  rp=h?rp+1:0;rh=p?rh+1:0;maxProt=Math.max(maxProt,rp);maxPerf=Math.max(maxPerf,rh);
 }
 const run=f=>{let k=t;if(!f(k))k=addDays(k,-1);let n=0;while(k>=start&&f(k)){n++;k=addDays(k,-1)}return n};
 const wc={};for(const s of S.sessions){const w=weekStart(s.date);wc[w]=(wc[w]||0)+1}
 const okW=w=>(wc[w]||0)>=st.weekly;
 const cw=weekStart(t),sw=weekStart(start);
 let w=cw;if(!okW(w))w=addDays(w,-7);let weekStreak=0;while(w>=sw&&okW(w)){weekStreak++;w=addDays(w,-7)}
 let maxWeek=0,r=0;for(let x=sw;x<=cw;x=addDays(x,7)){r=okW(x)?r+1:0;maxWeek=Math.max(maxWeek,r)}
 const sessXP=S.sessions.reduce((a,s)=>a+(s.xp||0),0);
 const stats={workouts:S.sessions.length,pbs:S.sessions.reduce((a,s)=>a+(s.pbs?.length||0),0),maxWeek,maxProt,hitDays,maxPerf,extras:S.sessions.filter(s=>s.extra).length,maxVol:Math.max(0,...S.sessions.map(s=>s.vol||0))};
 const ach=ACH.map(([id,name,desc,xp,f])=>({id,name,desc,xp,ok:f(stats)}));
 const achXP=ach.filter(a=>a.ok).reduce((a,b)=>a+b.xp,0);
 const total=sessXP+protXP+habXP+achXP;
 let level=1,rem=total;while(rem>=need(level)){rem-=need(level);level++}
 return{total,level,into:rem,need:need(level),rank:rankOf(level),weekStreak,protStreak:run(hit),perfStreak:run(perfect),stats,ach,hit,pT,perfect,activeH,wc,parts:{sessXP,protXP,habXP,achXP}};
}
function habitStreak(id){const t=today(),f=k=>(S.habitLog[k]||[]).includes(id);let k=t;if(!f(k))k=addDays(k,-1);let n=0;while(f(k)&&n<3650){n++;k=addDays(k,-1)}return n}

const sorted=()=>[...S.sessions].sort((a,b)=>a.end-b.end);
function hist(name){const k=norm(name),out=[];for(const s of sorted()){const e=s.exercises.find(x=>norm(x.name)===k);if(e&&e.sets.length)out.push({date:s.date,sets:e.sets})}return out}
const lastOf=name=>{const h=hist(name);return h[h.length-1]||null};
const bestOf=name=>{let b=null;for(const h of hist(name))for(const s of h.sets)if(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))b=s;return b};
function phOf(name,si){const l=lastOf(name);return l?(l.sets[si]||l.sets[l.sets.length-1]):null}

/* ---------- workout logic ---------- */
let wl=null;
async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
function sleep(){try{wl?.release()}catch(e){}wl=null}
function updProg(){const[d,t]=progCounts();const p=$('#prog'),b=$('#pbar');if(p)p.textContent=`${d}/${t}`;if(b)b.style.width=(t?d/t*100:0)+'%'}
let restEnd=0,restTot=1,restIv=null,actx=null;
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}}
function startRest(){const r=+S.settings.rest;if(!r)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}restTot=r*1000;restEnd=Date.now()+restTot;clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest()}
function tickRest(){const el=$('#rest'),left=restEnd-Date.now();if(left<=0){clearInterval(restIv);restIv=null;el.hidden=true;try{navigator.vibrate?.([250,120,250])}catch(e){}beep();toast('Rest over · next set',true);return}el.hidden=false;$('#restt').textContent=fmtDur(left+999);$('#restb').style.width=Math.min(100,left/restTot*100)+'%'}
function stopRest(){clearInterval(restIv);restIv=null;$('#rest').hidden=true}
function startWorkout(id){
 const w=S.workouts.find(x=>x.id===id);
 S.active={id:uid(),workoutId:w?w.id:null,name:w?w.name:'Workout',date:today(),start:Date.now(),
  exercises:(w?w.exercises:[]).map(e=>({name:e.name,target:`${e.sets} × ${e.reps}`,sets:Array.from({length:Math.max(1,Math.min(10,+e.sets||1))},()=>({w:'',r:'',done:false}))}))};
 save();view='workout';render();scrollTo(0,0);wake();
}
async function finish(){
 const a=S.active,[d,t]=progCounts(),u=S.settings.unit;
 if(!d){if(await ask('No sets ticked yet. Discard this workout?','Discard workout')){S.active=null;save();stopRest();sleep();view='today';render()}return}
 if(d<t&&!(await ask(`${t-d} set${t-d>1?'s':''} not ticked. Finish anyway? Unticked sets won't be saved.`,'Finish workout',false)))return;
 const before=calc();
 const br=[['Workout complete',100],[`${d} sets logged`,d*5]],pbs=[];let vol=0;
 const exs=a.exercises.map(e=>({name:e.name.trim()||'Exercise',sets:e.sets.filter(s=>s.done).map(s=>({w:parseFloat(s.w)||0,r:parseInt(s.r)||0}))})).filter(e=>e.sets.length);
 for(const e of exs){
  for(const s of e.sets)vol+=s.w*s.r;
  const h=hist(e.name);if(!h.length)continue;
  const all=h.flatMap(x=>x.sets),prevMax=Math.max(...all.map(s=>s.w)),top=Math.max(...e.sets.map(s=>s.w));
  const last=h[h.length-1],lastTop=Math.max(...last.sets.map(s=>s.w));
  if(top>prevMax){pbs.push({name:e.name,type:'Weight PB',val:`${top}${u}`});br.push([`Weight PB · ${e.name}`,25])}
  else{let rp=null;for(const s of e.sets){const pr=all.filter(x=>x.w===s.w).map(x=>x.r);if(pr.length&&s.r>Math.max(...pr)&&(!rp||s.w>rp.w))rp=s}
   if(rp){pbs.push({name:e.name,type:'Rep PB',val:rp.w?`${rp.w}${u} × ${rp.r}`:`${rp.r} reps`});br.push([`Rep PB · ${e.name}`,10])}}
  if(top>lastTop)br.push([`Weight up · ${e.name}`,15]);
  else if(top===lastTop){const rn=e.sets.filter(s=>s.w===top).reduce((x,s)=>x+s.r,0),rl=last.sets.filter(s=>s.w===top).reduce((x,s)=>x+s.r,0);if(rn>rl)br.push([`More reps · ${e.name}`,10])}
 }
 const wk=weekStart(a.date),extra=S.sessions.filter(s=>weekStart(s.date)===wk).length>=S.settings.weekly;
 if(extra)br.push(['Extra session',50]);
 const sess={id:a.id,workoutId:a.workoutId,name:a.name,date:a.date,start:a.start,end:Date.now(),exercises:exs,sets:d,vol:Math.round(vol),pbs,extra,xp:0,br};
 S.sessions.push(sess);
 const mid=calc();if(mid.weekStreak>0)br.push([`Week streak × ${mid.weekStreak}`,Math.min(100,mid.weekStreak*10)]);
 sess.xp=br.reduce((x,b)=>x+b[1],0);S.active=null;save();
 const after=calc(),gained=after.total-before.total,lv=after.level>S.seenLevel;
 S.seenLevel=after.level;const nu=after.ach.filter(x=>x.ok&&!S.seenAch.includes(x.id));S.seenAch.push(...nu.map(x=>x.id));save();
 stopRest();sleep();view='today';render();scrollTo(0,0);
 sheet(`<div class="c"><div class="eyebrow red">Workout complete</div><div class="h2">${esc(sess.name)}</div><div class="sumx num">+${nf(gained)}</div><div class="mut sm">XP earned · ${fmtDur(sess.end-sess.start)} · ${nf(sess.vol)} ${u} lifted</div></div>
 ${lv?`<div class="lvbanner">Level up! You're now level ${after.level} · ${esc(after.rank)}</div>`:''}
 ${pbs.length?`<div class="h3 mt">New PBs</div>${pbs.map(p=>`<div class="xb"><span>${esc(p.name)} <span class="mut sm">${p.type}</span></span><b>${esc(p.val)}</b></div>`).join('')}`:''}
 <div class="h3 mt">XP breakdown</div>${br.map(([l,x])=>`<div class="xb"><span>${esc(l)}</span><b>+${x}</b></div>`).join('')}${nu.map(x=>`<div class="xb"><span>Achievement · ${esc(x.name)}</span><b>+${x.xp}</b></div>`).join('')}
 <button class="btn red full lg" data-a="close">Done</button>`);
 try{navigator.vibrate?.([30,60,30,60,120])}catch(e){}
}

/* ---------- actions ---------- */
const A={
 nav:v=>{view=v;editW=null;closeSheet();render();scrollTo(0,0)},
 close:()=>closeSheet(),
 askY:()=>{const r=askRes;askRes=null;closeSheet();r&&r(true)},
 askN:()=>closeSheet(),
 install:async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;render()},
 resume:()=>{view='workout';render();scrollTo(0,0);wake()},
 choose:()=>sheet(`<div class="h2">Choose a workout</div>${S.workouts.map(w=>`<button class="opt" data-a="start" data-v="${esc(w.id)}"><b>${esc(w.name)}</b><span class="mut sm">${w.exercises.length} exercises${w.day!=null?' · '+DAYS[w.day]:''}</span></button>`).join('')}<button class="opt" data-a="start" data-v=""><b>Empty workout</b><span class="mut sm">Add exercises as you go</span></button><button class="btn ghost full" data-a="close">Cancel</button>`),
 start:async v=>{closeSheet();if(S.active){if(!(await ask(`"${S.active.name}" is still in progress. Discard it and start a new one?`,'Discard and start')))return}startWorkout(v)},
 tick:(v,el)=>{const[ei,si]=v.split('.').map(Number),e=S.active.exercises[ei],s=e.sets[si],row=el.closest('.set');
  s.done=!s.done;
  if(s.done){const prev=e.sets[si-1],ph=phOf(e.name,si)||(prev&&(prev.w!==''||prev.r!=='')?prev:null),[wi,ri]=row.querySelectorAll('input');if(s.w===''&&ph)s.w=String(ph.w);if(s.r===''&&ph)s.r=String(ph.r);wi.value=s.w;ri.value=s.r;startRest();try{navigator.vibrate?.(15)}catch(x){}}
  row.classList.toggle('on',s.done);save();updProg()},
 setAdd:v=>{const e=S.active.exercises[+v],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:l?l.r:'',done:false});save();render()},
 setDel:v=>{const e=S.active.exercises[+v];if(e.sets.length>1){e.sets.pop();save();render()}},
 exDel:async v=>{const e=S.active.exercises[+v];if(await ask(`Remove ${e.name} from this workout?`,'Remove')){S.active.exercises.splice(+v,1);save();render()}},
 addEx:async()=>{const n=await inputSheet('Add exercise','Exercise name');if(!n)return;const ph=lastOf(n);S.active.exercises.push({name:n,target:'',sets:Array.from({length:ph?ph.sets.length:3},()=>({w:'',r:'',done:false}))});save();render();scrollTo(0,document.body.scrollHeight)},
 discard:async()=>{if(await ask('Discard this workout? Nothing from it will be saved.','Discard workout')){S.active=null;save();stopRest();sleep();view='today';render()}},
 finish:()=>finish(),
 rest:v=>{restEnd+=+v*1000;restTot=Math.max(restTot,restEnd-Date.now());tickRest()},
 restSkip:()=>stopRest(),
 hideSample:()=>{S.sample=false;save();render()},
 editW:v=>{editW=v;render();scrollTo(0,0)},
 newW:()=>{const w={id:uid(),name:'New workout',day:null,exercises:[{id:uid(),name:'',sets:3,reps:'10'}]};S.workouts.push(w);save();editW=w.id;render();scrollTo(0,0)},
 editDone:()=>{const w=S.workouts.find(x=>x.id===editW);if(w){w.name=w.name.trim()||'Workout';w.exercises=w.exercises.filter(e=>e.name.trim())}editW=null;save();render();scrollTo(0,0)},
 delW:async()=>{const w=S.workouts.find(x=>x.id===editW);if(w&&await ask(`Delete "${w.name}"? Your past sessions and PBs stay.`,'Delete workout')){S.workouts=S.workouts.filter(x=>x!==w);editW=null;save();render()}},
 eadd:()=>{S.workouts.find(x=>x.id===editW).exercises.push({id:uid(),name:'',sets:3,reps:'10'});save();render();const ins=document.querySelectorAll('[data-f="en"]');ins[ins.length-1]?.focus()},
 eup:v=>{const ex=S.workouts.find(x=>x.id===editW).exercises,i=+v;if(i>0){[ex[i-1],ex[i]]=[ex[i],ex[i-1]];save();render()}},
 edn:v=>{const ex=S.workouts.find(x=>x.id===editW).exercises,i=+v;if(i<ex.length-1){[ex[i+1],ex[i]]=[ex[i],ex[i+1]];save();render()}},
 edel:v=>{S.workouts.find(x=>x.id===editW).exercises.splice(+v,1);save();render()},
 padd:(v,el)=>{const k=el.dataset.d||pDay;act(()=>{(S.protein[k]||(S.protein[k]=[])).push({id:uid(),g:+v,label:'Quick add',t:Date.now()})})},
 pfood:v=>{const f=S.foods[+v];act(()=>{(S.protein[pDay]||(S.protein[pDay]=[])).push({id:uid(),g:+f.g,label:f.name,t:Date.now()})})},
 pdel:v=>act(()=>{S.protein[pDay]=(S.protein[pDay]||[]).filter(x=>x.id!==v)}),
 fedit:()=>{foodEdit=!foodEdit;render()},
 fdel:v=>{S.foods.splice(+v,1);save();render()},
 ptarget:async()=>{const v=await inputSheet('Daily protein target (g)','150',String(S.settings.protein),'numeric');const n=parseInt(v);if(n>0)act(()=>{S.settings.protein=n})},
 pday:v=>{pDay=addDays(pDay,+v);if(pDay>today())pDay=today();render()},
 hday:v=>{hDay=addDays(hDay,+v);if(hDay>today())hDay=today();render()},
 htog:(v,el)=>{const k=el.dataset.d;try{navigator.vibrate?.(12)}catch(e){}act(()=>{const l=S.habitLog[k]||(S.habitLog[k]=[]),i=l.indexOf(v);i<0?l.push(v):l.splice(i,1)})},
 hren:async v=>{const h=S.habits.find(x=>x.id===v);const n=await inputSheet('Rename habit','Habit',h.name);if(n){h.name=n;save();render()}},
 hdel:async v=>{const h=S.habits.find(x=>x.id===v);if(await ask(`Delete "${h.name}"? XP you've already earned from it is kept.`,'Delete habit'))act(()=>{if(h.created>=today())S.habits=S.habits.filter(x=>x!==h);else h.archived=today()})},
 openEx:v=>{openEx=openEx===v?null:v;render()},
 openSess:v=>{openSess=openSess===v?null:v;render()},
 sdel:async v=>{if(await ask('Delete this workout from your history? Its XP and PBs are removed too.','Delete'))act(()=>{S.sessions=S.sessions.filter(s=>s.id!==v)})},
 optday:v=>act(()=>{const d=+v,o=S.settings.optDays,i=o.indexOf(d);i<0?o.push(d):o.splice(i,1)}),
 unit:v=>{S.settings.unit=v;save();render()},
 export:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`forge-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);S.lastBackup=today();save();render();toast('Backup file saved')}catch(e){toast('Export failed. Try Copy instead.')}},
 copy:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));S.lastBackup=today();save();render();toast('Backup copied. Paste it somewhere safe.')}catch(e){toast('Copy was blocked by the browser')}},
 reset:async()=>{if(await ask('Delete all workouts, PBs, protein logs, habits and XP on this phone? This cannot be undone.','Delete everything')){S=defaults();save();view='today';render();toast('All data reset')}}
};
document.addEventListener('click',e=>{
 if(e.target.id==='ov'){closeSheet();return}
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset.v,t,e)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;
 if(f==='inp'){const v=$('#inpv').value.trim(),r=askRes;askRes=null;closeSheet();r&&r(v||null)}
 if(f==='hadd'){const n=$('#hnew').value.trim();if(!n)return;S.habits.push({id:uid(),name:n,created:today()});save();render();$('#hnew')?.focus()}
 if(f==='padd'){const g=parseFloat($('#pg').value),l=$('#pl').value.trim(),sv2=$('#ps').checked;if(!(g>0)){$('#pg').focus();return}
  act(()=>{(S.protein[pDay]||(S.protein[pDay]=[])).push({id:uid(),g,label:l||'Custom',t:Date.now()});if(sv2&&l)S.foods.push({name:l,g})})}
 if(f==='bw'){const v=parseFloat($('#bwv').value);if(v>0){S.body[today()]=v;save();render();toast('Bodyweight saved')}}
});
document.addEventListener('input',e=>{
 const el=e.target,f=el.dataset.f;if(!f)return;const v=el.value;
 if(f==='w'||f==='r'){const row=el.closest('.set');if(!row||!S.active)return;S.active.exercises[+row.dataset.e].sets[+row.dataset.s][f]=v;save();return}
 const w=S.workouts.find(x=>x.id===editW),i=+el.dataset.i;
 if(f==='wname'&&w)w.name=v;
 if(f==='en'&&w)w.exercises[i].name=v;
 if(f==='es'&&w)w.exercises[i].sets=Math.max(1,Math.min(10,parseInt(v)||1));
 if(f==='er'&&w)w.exercises[i].reps=v;
 if(f==='sprot')S.settings.protein=Math.max(0,parseInt(v)||0);
 if(f==='sweek')S.settings.weekly=Math.max(1,Math.min(7,parseInt(v)||1));
 save();
});
document.addEventListener('change',async e=>{
 const el=e.target,f=el.dataset.f;if(!f)return;
 if(f==='wday'){const w=S.workouts.find(x=>x.id===editW);if(w){w.day=el.value===''?null:+el.value;save()}}
 if(f==='srest'){S.settings.rest=+el.value;save()}
 if(f==='sprot'||f==='sweek'){const c=calc();notify(c)}
 if(f==='import'){const file=el.files&&el.files[0];el.value='';if(!file)return;let d;try{d=JSON.parse(await file.text())}catch(x){toast('That file isn\'t a valid backup');return}
  if(!d||!d.v||!Array.isArray(d.sessions)||!Array.isArray(d.workouts)){toast('That file isn\'t a Forge backup');return}
  if(await ask('Replace everything on this phone with this backup?','Replace my data')){const s=Object.assign(defaults(),d);s.settings=Object.assign(defaults().settings,d.settings||{});S=s;save();render();toast('Backup restored')}}
});

/* ---------- lifecycle ---------- */
setInterval(()=>{const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.start)},1000);
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(today()!==lastDay){if(hDay===lastDay)hDay=today();if(pDay===lastDay)pDay=today();lastDay=today();render()}if(view==='workout')wake();if(restIv)tickRest()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!$('#ov').hidden)return;render()});
window.addEventListener('appinstalled',()=>{dp=null;render();toast('Forge installed')});
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
if(S.active){view='workout'}
render();
}
</script>
</body>
</html>
